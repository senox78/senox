<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 680" width="1360" height="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .ws   { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 1; }
    .win  { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1; }
    .mon  { fill: none; stroke: #184f95; stroke-width: 3; stroke-dasharray: 14 10; }
    .note { fill: #faece7; stroke: #993c1d; stroke-width: 1; }
    .t    { fill: #52514e; font-size: 20px; }
    .tl   { fill: #52514e; font-size: 22px; }
    .tr   { fill: #993c1d; font-size: 19px; }
  </style>
  <rect width="1360" height="680" fill="#ffffff"/>

  <!-- monitor 1 -->
  <text class="tl" x="46" y="52">monitor 1</text>
  <rect class="mon" x="40" y="70" width="620" height="500" rx="14"/>

  <rect class="ws" x="70" y="100" width="560" height="130" rx="10"/>
  <text class="t" x="90" y="172">ws 1</text>
  <rect class="win" x="160" y="122" width="100" height="86" rx="8"/>
  <rect class="win" x="272" y="122" width="100" height="86" rx="8"/>
  <rect class="win" x="384" y="122" width="100" height="86" rx="8"/>

  <rect class="ws" x="70" y="255" width="560" height="130" rx="10"/>
  <text class="t" x="90" y="327">ws 2</text>
  <rect class="win" x="160" y="277" width="100" height="86" rx="8"/>
  <rect class="win" x="272" y="277" width="100" height="86" rx="8"/>

  <rect class="ws" x="70" y="410" width="560" height="130" rx="10"/>
  <text class="t" x="90" y="482">ws 3</text>
  <rect class="win" x="160" y="432" width="100" height="86" rx="8"/>
  <rect class="win" x="272" y="432" width="100" height="86" rx="8"/>
  <rect class="win" x="384" y="432" width="100" height="86" rx="8"/>
  <rect class="win" x="496" y="432" width="100" height="86" rx="8"/>

  <!-- monitor 2 -->
  <text class="tl" x="706" y="52">monitor 2</text>
  <rect class="mon" x="700" y="70" width="620" height="500" rx="14"/>

  <rect class="ws" x="730" y="100" width="560" height="130" rx="10"/>
  <text class="t" x="750" y="172">ws 1</text>
  <rect class="win" x="820" y="122" width="100" height="86" rx="8"/>
  <rect class="win" x="932" y="122" width="100" height="86" rx="8"/>

  <rect class="ws" x="730" y="255" width="560" height="130" rx="10"/>
  <text class="t" x="750" y="327">ws 2</text>
  <rect class="win" x="820" y="277" width="100" height="86" rx="8"/>
  <rect class="win" x="932" y="277" width="100" height="86" rx="8"/>
  <rect class="win" x="1044" y="277" width="100" height="86" rx="8"/>

  <!-- annotation -->
  <rect class="note" x="370" y="600" width="620" height="46" rx="10"/>
  <text class="tr" x="680" y="629" text-anchor="middle">ws index is scoped per monitor — "ws 1" exists on both</text>
</svg>
